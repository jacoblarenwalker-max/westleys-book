<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAFAF8">
<title>Westley’s First Year</title>
<link rel="icon" href="icon.svg?v=wb1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=wb1">
<link rel="stylesheet" href="viewer.css?v=wb12">
<link rel="stylesheet" href="select.css?v=wb12">
<style>
:root{--sky:#4BA3E3;--sky-deep:#1B5E96;--navy:#0F2747;--bg:#FAFAF8;--surface:#fff;--beige:#EADFCC;--line:#ECE4D6;--ink:#1C2A3F;--muted:#505B6B;
--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--font);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--sky);color:var(--navy);padding:34px 20px 26px;text-align:center;border-bottom:2px solid #2E88CC}
header .moon{font-size:34px}
h1{margin:6px 0 2px;font-size:28px;letter-spacing:-.3px}
header p{margin:0;font-size:15px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:18px 14px 40px}
.day{margin:22px 4px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sky-deep);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.day button.wbs-group{text-transform:none;letter-spacing:0}
.tools{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 8px) 18px 8px;background:rgba(250,250,248,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tools span{font-size:14px;color:var(--muted);font-weight:600}
.tools button{font:inherit;font-size:15px;font-weight:700;min-height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--sky-deep);background:transparent;color:var(--sky-deep);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--sky-deep);color:#fff}
html.wbs-on main{padding-bottom:160px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.card .txt{padding:14px 16px 4px;white-space:pre-wrap;word-wrap:break-word}
.card .by{padding:2px 16px 14px;font-size:14px;color:var(--muted)}
.grid{display:grid;gap:3px;grid-template-columns:repeat(2,1fr)}
.grid.n1{grid-template-columns:1fr}
.grid.all{grid-template-columns:repeat(3,1fr)}
.grid .cell{display:block;padding:0;margin:0;border:0;border-radius:0;background:var(--beige);overflow:hidden;cursor:zoom-in;font:inherit;color:inherit}
.grid.n3 .cell:first-child{grid-column:1/3}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--beige)}
.grid.n1 img{aspect-ratio:auto;max-height:520px}
.grid .more-n{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,39,71,.45);color:#fff;font-size:26px;font-weight:700;pointer-events:none}
.msg{text-align:center;color:var(--muted);padding:60px 20px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 30px}
</style>
</head>
<body>
<header><div class="moon">🌙</div><h1>Westley’s First Year</h1><p id="sub">Born October 4, 2026</p></header>
<main id="m"><p class="msg">Loading…</p></main>
<footer>Made with love from Daddy and Momma.</footer>
<script type="module">
import { openViewer } from './viewer.js?v=wb12';
import { createSelect } from './select.js?v=wb12';
(async () => {
  const FN = 'https://voydoxmxdnjnewxlwzse.supabase.co/functions/v1/wb-family-feed';
  const m = document.getElementById('m');
  const k = new URLSearchParams(location.search).get('k') || '';
  const msg = (t) => { m.innerHTML = ''; const p = document.createElement('p'); p.className = 'msg'; p.textContent = t; m.append(p); };
  if (!k) return msg('This page needs the link from Jacob and Sophie.');
  let d;
  try { const r = await fetch(FN + '?k=' + encodeURIComponent(k)); if (!r.ok) return msg(r.status === 404 ? 'This link isn’t working anymore. Ask Jacob or Sophie for a new one.' : 'Couldn’t load right now. Try again in a bit.'); d = await r.json(); }
  catch { return msg('Couldn’t load right now. Check your connection and try again.'); }
  const born = new Date(d.born + 'T12:00:00');
  const age = Math.floor((Date.now() - born) / 864e5);
  document.getElementById('sub').textContent = `Born October 4, 2026 · ${age < 14 ? age + ' days' : age < 60 ? Math.floor(age / 7) + ' weeks' : Math.floor(age / 30.44) + ' months'} old`;
  if (!d.memories.length) return msg('No memories yet. Check back soon!');
  m.innerHTML = '';
  const fmt = (s) => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  // every photo on the page, in order, so swiping keeps going into the next memory
  const all = [];
  for (const mem of d.memories) mem.photos.forEach((u, n) => { mem._start ??= all.length; all.push({ key: all.length, getUrl: () => u, caption: mem.text || '', meta: [fmt(mem.date), mem.author ? 'from ' + mem.author : '', mem.photos.length > 1 ? `${n + 1} of ${mem.photos.length}` : ''].filter(Boolean).join(' · '), filename: `westley-${mem.date}-${n + 1}.jpg` }); });
  // pick several photos (tap Select or press and hold one) to share or download the originals
  const grids = [];
  const pick = createSelect({ items: () => all, label: 'photos', edges: () => ({ top: document.querySelector('.tools')?.getBoundingClientRect().bottom ?? 0 }), onModeChange: (on) => { selBtn.textContent = on ? 'Done' : 'Select'; selBtn.setAttribute('aria-pressed', String(on)); for (const g of grids) if (g.big) g.draw(); } });
  const selBtn = el('button', null, 'Select'); selBtn.type = 'button'; selBtn.setAttribute('aria-pressed', 'false');
  selBtn.onclick = () => (pick.active ? pick.exit() : pick.enter());
  if (all.length) { const t = el('div', 'tools'); t.append(el('span', null, `${all.length} photo${all.length === 1 ? '' : 's'}`), selBtn); m.append(t); }
  const byDay = new Map();
  for (const mem of d.memories) { if (!byDay.has(mem.date)) byDay.set(mem.date, []); byDay.get(mem.date).push(mem); }
  for (const [date, mems] of byDay) {
    const head = el('div', 'day'); head.append(el('span', null, fmt(date)));
    const keys = mems.flatMap((mem) => mem.photos.map((_, i) => mem._start + i));
    if (keys.length) head.append(pick.groupToggle(() => keys, ['Select', 'Deselect']));
    m.append(head);
    for (const mem of mems) {
      const c = el('article', 'card');
      if (mem.photos.length) {
        const holder = el('div');
        const draw = () => {
          const n = mem.photos.length, every = pick.active && n > 4, show = every ? mem.photos : mem.photos.slice(0, 4);
          const g = el('div', 'grid ' + (every ? 'all' : 'n' + Math.min(n, 4)));
          show.forEach((u, i) => {
            const b = el('button', 'cell'); b.type = 'button'; b.setAttribute('aria-label', `Photo ${i + 1} of ${n}`);
            const img = el('img'); img.src = u; img.loading = 'lazy'; img.alt = 'Photo of Westley'; img.draggable = false;
            b.append(img);
            if (!every && i === 3 && n > 4) b.append(el('span', 'more-n', '+' + (n - 4)));
            g.append(pick.bindThumb(b, mem._start + i, () => openViewer(all, mem._start + i, { label: 'Photos of Westley' })));
          });
          holder.replaceChildren(g);
        };
        draw(); grids.push({ draw, big: mem.photos.length > 4 }); // only grids with hidden photos change in select mode
        c.append(holder);
      }
      if (mem.text) c.append(el('div', 'txt', mem.text));
      c.append(el('div', 'by', mem.author ? '— ' + mem.author : ''));
      m.append(c);
    }
  }
})();
</script>
</body>
</html>
